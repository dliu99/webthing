<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>webthing</title>
<style>
:root{color-scheme:dark;--fg:#fff;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}button{touch-action:manipulation}.hidden{display:none!important}
#bg{position:fixed;inset:-10%;background:#050505 center/cover no-repeat;filter:blur(56px) saturate(.85) brightness(.31);transform:scale(1.14);transition:background-image .45s ease}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.60),rgba(0,0,0,.08) 46%,rgba(0,0,0,.42)),linear-gradient(0deg,rgba(0,0,0,.48),transparent 55%)}
#app{position:relative;width:100%;height:100%;padding:22px 28px}
.center{height:100%;display:grid;place-items:center;text-align:center}.loginBox{width:min(520px,88vw)}.wordmark{font-size:clamp(46px,7vw,88px);font-weight:850;letter-spacing:-.06em}.copy{margin:10px 0 26px;color:var(--muted);font-size:clamp(15px,1.8vw,21px)}.pill{border:0;border-radius:999px;padding:15px 24px;background:#fff;color:#000;font-weight:800;cursor:pointer}
#player{height:100%;display:grid;grid-template-columns:min(39vh,35vw) minmax(0,1fr);grid-template-rows:1fr auto;gap:12px clamp(28px,5vw,72px);align-items:center}.cover{grid-row:1/3;aspect-ratio:1;width:100%;max-height:78vh;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 24px 80px rgba(0,0,0,.42)}.cover img{width:100%;height:100%;object-fit:cover;display:block}.main{min-width:0;align-self:end;padding-bottom:1vh}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.context,.clock{font-size:clamp(12px,1.35vw,18px);font-weight:700;color:rgba(255,255,255,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clock{font-variant-numeric:tabular-nums}.title{font-size:clamp(40px,6vw,92px);line-height:.96;font-weight:850;letter-spacing:-.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:clamp(20px,2.55vw,36px);font-weight:560;color:var(--muted);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.visualizer{height:44px;display:flex;align-items:center;gap:6px;margin-top:22px}.bar{width:5px;height:9px;background:#fff;border-radius:6px;opacity:.62;animation:bounce 1s ease-in-out infinite alternate;animation-play-state:paused}.playing .bar{animation-play-state:running}.bar:nth-child(2){animation-duration:.73s}.bar:nth-child(3){animation-duration:1.19s}.bar:nth-child(4){animation-duration:.88s}.bar:nth-child(5){animation-duration:1.34s}.bar:nth-child(6){animation-duration:.67s}.bar:nth-child(7){animation-duration:1.08s}.bar:nth-child(8){animation-duration:.81s}.bar:nth-child(9){animation-duration:1.27s}.bar:nth-child(10){animation-duration:.76s}@keyframes bounce{to{height:40px;opacity:1}}
.bottom{min-width:0;align-self:start}.progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;cursor:pointer}.fill{height:100%;width:0;background:#fff;border-radius:99px}.times{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:rgba(255,255,255,.44);font-variant-numeric:tabular-nums}.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:10px}.side{display:flex;align-items:center}.right{justify-content:flex-end}.transport{display:flex;align-items:center;gap:16px}.icon{width:48px;height:48px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;opacity:.88;transition:transform .10s ease,background .10s ease,opacity .10s ease}.icon svg{width:26px;height:26px;fill:currentColor;pointer-events:none}.icon:active,.icon.pressed{transform:scale(.82);background:rgba(255,255,255,.12);opacity:1}.play{width:64px;height:64px;background:#fff;color:#000;opacity:1}.play:active,.play.pressed{transform:scale(.86);background:#e9e9e9}.play svg{width:30px;height:30px}.deviceBtn{width:auto;max-width:220px;padding:0 10px;display:flex;gap:8px;color:rgba(255,255,255,.68);font-size:13px;font-weight:700}.deviceBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gear{opacity:.64}
#idle{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column}.idleclock{font-size:clamp(110px,22vw,310px);line-height:.82;font-weight:850;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.idledate{margin-top:24px;font-size:clamp(22px,3vw,40px);color:var(--muted)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);z-index:9}.panel{position:fixed;z-index:10;right:22px;bottom:22px;width:min(390px,88vw);padding:18px;border-radius:18px;background:rgba(18,18,18,.96);border:1px solid rgba(255,255,255,.11);box-shadow:0 24px 80px rgba(0,0,0,.5)}.panelHead{display:flex;align-items:center;justify-content:space-between}.panelTitle{font-weight:800}.close{border:0;background:transparent;font-size:25px;cursor:pointer}.panel label{display:block;margin:15px 0 7px;font-size:12px;color:var(--muted)}.panel select{width:100%;background:#0e0e0e;border:1px solid #333;border-radius:11px;padding:11px}.panel input{width:100%;accent-color:#fff}.signout{width:100%;margin-top:16px;padding:11px;border-radius:11px;border:1px solid #333;background:#101010;cursor:pointer}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:#171717;border:1px solid #333;font-size:12px;opacity:0;transition:.18s;pointer-events:none;z-index:20}.toast.show{opacity:1}
@media(max-width:800px),(orientation:portrait){#app{padding:16px}#player{grid-template-columns:1fr;grid-template-rows:minmax(0,45%) auto 1fr;row-gap:13px}.cover{grid-row:auto;height:100%;width:auto;max-width:100%;margin:auto}.title{font-size:clamp(34px,10vw,64px)}.visualizer{display:none}.clock{display:none}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="app">
<section id="login" class="center hidden"><div class="loginBox"><div class="wordmark">webthing</div><div class="copy">spotify, stripped down.</div><button id="signin" class="pill">connect spotify</button></div></section>
<section id="idle" class="hidden"><div id="idleClock" class="idleclock">--:--</div><div id="idleDate" class="idledate"></div></section>
<section id="player" class="hidden">
<div class="cover"><img id="art" alt="album artwork"></div>
<div class="main"><div class="topline"><div id="context" class="context">spotify</div><div id="clock" class="clock">--:--</div></div><div id="track" class="title">nothing playing</div><div id="artist" class="artist"></div><div class="visualizer" aria-hidden="true"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div></div>
<div class="bottom"><div id="progress" class="progress"><div id="fill" class="fill"></div></div><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><div class="side"><button id="device" class="icon deviceBtn" aria-label="settings"><svg viewBox="0 0 24 24"><path d="M1 18v3h3a3 3 0 0 0-3-3Zm0-5v2a6 6 0 0 1 6 6h2a8 8 0 0 0-8-8Zm0-4v2c5.52 0 10 4.48 10 10h2C13 14.37 7.63 9 1 9Zm14-6H9a2 2 0 0 0-2 2v3h2V5h6v6h-2v2h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/></svg><span id="deviceName">device</span></button></div><div class="transport"><button id="prev" class="icon" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button><button id="play" class="icon play" aria-label="play pause"></button><button id="next" class="icon" aria-label="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button></div><div class="side right"><button id="settings" class="icon gear" aria-label="settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58-1.92-3.32-2.39.96a7.27 7.27 0 0 0-1.62-.94L14.88 3h-3.84l-.36 2.18c-.58.24-1.12.56-1.62.94l-2.39-.96-1.92 3.32 2.03 1.58c-.03.31-.05.63-.05.94s.02.63.05.94l-2.03 1.58 1.92 3.32 2.39-.96c.5.38 1.04.7 1.62.94l.36 2.18h3.84l.36-2.18c.58-.24 1.12-.56 1.62-.94l2.39.96 1.92-3.32-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg></button></div></div></div>
</section>
</div>
<div id="scrim" class="hidden"></div><div id="panel" class="panel hidden"><div class="panelHead"><div class="panelTitle">settings</div><button id="closePanel" class="close">×</button></div><label for="devices">spotify connect</label><select id="devices"></select><label for="volume">volume</label><input id="volume" type="range" min="0" max="100" step="1"><button id="signout" class="signout">disconnect spotify</button></div><div id="toast" class="toast"></div>
<script>
const CLIENT_ID='535468c73264439eb3e61bca260e4c3c';
const REDIRECT=location.origin+'/';
const SCOPES='user-read-playback-state user-read-currently-playing user-modify-playback-state';
const $=s=>document.querySelector(s);let playback=null,localStamp=Date.now(),timer=null;
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
function show(id){['login','idle','player'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function fmt(ms){const s=Math.max(0,Math.floor((ms||0)/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function clock(){const d=new Date(),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('#clock').textContent=t;$('#idleClock').textContent=t;$('#idleDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});if(playback?.is_playing&&playback.item){const p=Math.min(playback.item.duration_ms,(playback.progress_ms||0)+(Date.now()-localStamp));paintProgress(p,playback.item.duration_ms)}}setInterval(clock,1000);clock();
function bytes(n=48){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function challenge(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function signin(){const verifier=bytes(),state=bytes(16);sessionStorage.setItem('pkce_verifier',verifier);sessionStorage.setItem('oauth_state',state);const u=new URL('https://accounts.spotify.com/authorize');u.search=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:await challenge(verifier),state,scope:SCOPES,show_dialog:'false'});location.assign(u)}
function store(j){localStorage.setItem('spotify_access_token',j.access_token);localStorage.setItem('spotify_expires_at',String(Date.now()+j.expires_in*1000));if(j.refresh_token)localStorage.setItem('spotify_refresh_token',j.refresh_token)}
async function exchange(code){const verifier=sessionStorage.getItem('pkce_verifier');const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT,code_verifier:verifier})});if(!r.ok)throw Error('spotify sign-in failed');store(await r.json());history.replaceState({},'',REDIRECT)}
async function refresh(){const rt=localStorage.getItem('spotify_refresh_token');if(!rt)throw Error('sign in again');const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'refresh_token',refresh_token:rt})});if(!r.ok)throw Error('refresh failed');store(await r.json())}
async function token(){if(Number(localStorage.getItem('spotify_expires_at')||0)<Date.now()+30000)await refresh();return localStorage.getItem('spotify_access_token')}
async function api(path,opt={}){const t=await token();let r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,...opt.headers}});if(r.status===401){await refresh();r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+await token(),...opt.headers}})}if(!r.ok&&r.status!==204)throw Error('spotify '+r.status);return r.status===204?null:r.json()}
function paintProgress(p,d){$('#fill').style.width=(d?Math.min(100,p/d*100):0)+'%';$('#elapsed').textContent=fmt(p);$('#duration').textContent=fmt(d)}
function render(p){playback=p;localStamp=Date.now();if(!p||!p.item){show('idle');document.body.classList.remove('playing');return}show('player');const img=p.item.album?.images?.[0]?.url||'';$('#art').src=img;$('#bg').style.backgroundImage=img?`url(${JSON.stringify(img)})`:'none';$('#track').textContent=p.item.name||'';$('#artist').textContent=(p.item.artists||[]).map(a=>a.name).join(', ');$('#context').textContent=p.context?.type?('spotify · '+p.context.type):'spotify';$('#play').innerHTML=p.is_playing?PAUSE:PLAY;$('#deviceName').textContent=p.device?.name||'device';$('#volume').value=p.device?.volume_percent??50;document.body.classList.toggle('playing',!!p.is_playing);paintProgress(p.progress_ms,p.item.duration_ms)}
async function update(){try{const r=await api('/me/player');render(r)}catch(e){console.error(e);if(String(e).includes('401'))show('login')}}
async function devices(){try{const d=await api('/me/player/devices'),sel=$('#devices');sel.innerHTML='';for(const x of d.devices){const o=document.createElement('option');o.value=x.id;o.textContent=x.name+(x.is_active?' · active':'');o.selected=x.is_active;sel.appendChild(o)}}catch(e){toast('could not load devices')}}
function openPanel(){devices();$('#scrim').classList.remove('hidden');$('#panel').classList.remove('hidden')}
function closePanel(){$('#scrim').classList.add('hidden');$('#panel').classList.add('hidden')}
async function act(fn){try{await fn();setTimeout(update,180)}catch(e){toast('spotify unavailable')}}
$('#signin').onclick=signin;$('#play').onclick=()=>act(()=>api(playback?.is_playing?'/me/player/pause':'/me/player/play',{method:'PUT'}));$('#prev').onclick=()=>act(()=>api('/me/player/previous',{method:'POST'}));$('#next').onclick=()=>act(()=>api('/me/player/next',{method:'POST'}));$('#device').onclick=openPanel;$('#settings').onclick=openPanel;$('#closePanel').onclick=closePanel;$('#scrim').onclick=closePanel;$('#devices').onchange=e=>act(()=>api('/me/player',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_ids:[e.target.value],play:true})}));$('#volume').onchange=e=>act(()=>api('/me/player/volume?volume_percent='+e.target.value,{method:'PUT'}));$('#progress').onclick=e=>{if(!playback?.item)return;const r=e.currentTarget.getBoundingClientRect(),pos=Math.round((e.clientX-r.left)/r.width*playback.item.duration_ms);act(()=>api('/me/player/seek?position_ms='+pos,{method:'PUT'}))};$('#signout').onclick=()=>{['spotify_access_token','spotify_refresh_token','spotify_expires_at'].forEach(k=>localStorage.removeItem(k));closePanel();show('login')};
for(const b of document.querySelectorAll('button')){const down=()=>b.classList.add('pressed'),up=()=>b.classList.remove('pressed');b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);b.addEventListener('touchstart',down,{passive:true});b.addEventListener('touchend',up,{passive:true})}
(async()=>{try{const q=new URLSearchParams(location.search),code=q.get('code');if(code){if(q.get('state')!==sessionStorage.getItem('oauth_state'))throw Error('oauth state mismatch');await exchange(code)}if(!localStorage.getItem('spotify_access_token')){show('login');return}show('idle');await update();timer=setInterval(update,3500)}catch(e){console.error(e);show('login')}})();
</script>
</body>
</html>
