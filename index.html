<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>webthing</title>
<style>
:root{color-scheme:dark;--fg:#f7f7f7;--muted:rgba(255,255,255,.64);--soft:rgba(255,255,255,.18);--glass:rgba(12,12,12,.50)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}.hidden{display:none!important}
#bg{position:fixed;inset:-8%;background:#080808 center/cover no-repeat;filter:blur(48px) saturate(.82) brightness(.35);transform:scale(1.12);transition:background-image .55s ease}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(0,0,0,.10) 45%,rgba(0,0,0,.34)),linear-gradient(0deg,rgba(0,0,0,.55),transparent 55%)}
#app{position:relative;width:100%;height:100%;padding:max(20px,env(safe-area-inset-top)) max(26px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(26px,env(safe-area-inset-left))}
.center{height:100%;display:grid;place-items:center;text-align:center}.loginBox{width:min(560px,88vw)}.wordmark{font-size:clamp(42px,7vw,86px);font-weight:800;letter-spacing:-.055em;margin-bottom:12px}.copy{color:var(--muted);font-size:clamp(15px,1.8vw,22px);margin-bottom:28px}.pill{border:0;border-radius:999px;padding:15px 24px;background:#fff;color:#000;font-weight:800;cursor:pointer}.tiny{font-size:12px;color:rgba(255,255,255,.38);margin-top:18px}
#player{width:100%;height:100%;display:grid;grid-template-columns:min(39vh,36vw) minmax(0,1fr);grid-template-rows:1fr auto;column-gap:clamp(28px,5vw,78px);row-gap:14px;align-items:center}
.cover{grid-row:1/3;aspect-ratio:1;width:100%;max-height:78vh;border-radius:18px;overflow:hidden;background:#171717;box-shadow:0 24px 80px rgba(0,0,0,.38)}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.main{min-width:0;align-self:end;padding-bottom:1vh}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:clamp(16px,2.5vh,30px)}
.now{font-size:clamp(12px,1.4vw,18px);font-weight:700;color:rgba(255,255,255,.72);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clock{font-size:clamp(15px,1.8vw,22px);font-weight:650;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.title{font-size:clamp(42px,6.4vw,96px);line-height:.96;font-weight:820;letter-spacing:-.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:clamp(21px,2.7vw,38px);font-weight:560;color:var(--muted);margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visualizer{height:46px;display:flex;align-items:center;gap:6px;margin-top:26px;opacity:.88}.vizbar{width:5px;height:12px;border-radius:5px;background:#fff;transform-origin:center;animation:pulse 1.1s ease-in-out infinite alternate;animation-play-state:paused}.playing .vizbar{animation-play-state:running}.vizbar:nth-child(2){animation-duration:.78s}.vizbar:nth-child(3){animation-duration:1.32s}.vizbar:nth-child(4){animation-duration:.92s}.vizbar:nth-child(5){animation-duration:1.18s}.vizbar:nth-child(6){animation-duration:.70s}.vizbar:nth-child(7){animation-duration:1.44s}.vizbar:nth-child(8){animation-duration:.84s}.vizbar:nth-child(9){animation-duration:1.04s}.vizbar:nth-child(10){animation-duration:.74s}@keyframes pulse{from{height:8px;opacity:.42}to{height:42px;opacity:1}}
.bottom{min-width:0;align-self:start}.progress{height:5px;background:rgba(255,255,255,.20);border-radius:999px;overflow:hidden;cursor:pointer}.fill{height:100%;width:0;background:#fff;border-radius:999px}.times{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:rgba(255,255,255,.48);font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:12px}.leftctl,.rightctl{display:flex;align-items:center;gap:10px}.rightctl{justify-content:flex-end}.transport{display:flex;align-items:center;gap:18px}.icon{width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:50%;opacity:.86}.icon:active{background:rgba(255,255,255,.10)}.icon svg{width:26px;height:26px;fill:currentColor}.play{width:64px;height:64px;background:#fff;color:#000;opacity:1}.play svg{width:30px;height:30px}.deviceBtn{max-width:240px;width:auto;padding:0 10px;gap:8px;display:flex;align-items:center;color:rgba(255,255,255,.72);font-size:13px;font-weight:650}.deviceBtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel{position:fixed;right:18px;bottom:18px;width:min(420px,88vw);padding:18px;border-radius:20px;background:rgba(20,20,20,.94);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.45)}#panel label{font-size:12px;color:var(--muted);display:block;margin:12px 0 7px}#panel select{width:100%;background:#101010;border:1px solid #333;border-radius:12px;padding:12px}#panel input{width:100%;accent-color:#fff}.panelrow{display:flex;justify-content:space-between;align-items:center}.panelclose{border:0;background:transparent;font-size:22px;cursor:pointer}.signout{width:100%;border:1px solid #333;background:#111;border-radius:12px;padding:11px;margin-top:14px;cursor:pointer}
#idle{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.idleclock{font-size:clamp(110px,22vw,310px);line-height:.82;font-weight:820;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.idledate{margin-top:26px;font-size:clamp(22px,3vw,42px);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:rgba(20,20,20,.92);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#ddd;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:800px),(orientation:portrait){#player{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) auto 1fr;row-gap:16px}.cover{grid-row:auto;height:100%;width:auto;max-width:100%;margin:auto}.main{align-self:center}.bottom{align-self:start}.title{font-size:clamp(36px,10vw,66px)}.visualizer{display:none}.clock{display:none}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="app">
  <section id="login" class="center hidden">
    <div class="loginBox"><div class="wordmark">webthing</div><div class="copy">spotify, stripped down to the useful part.</div><button id="signin" class="pill">connect spotify</button><div class="tiny">authorization stays on this device</div></div>
  </section>
  <section id="idle" class="hidden"><div id="idleClock" class="idleclock">--:--</div><div id="idleDate" class="idledate"></div></section>
  <section id="player" class="hidden">
    <div class="cover"><img id="art" alt="album artwork"></div>
    <div class="main">
      <div class="topline"><div id="context" class="now">Spotify</div><div id="clock" class="clock">--:--</div></div>
      <div id="track" class="title">Nothing playing</div><div id="artist" class="artist"></div>
      <div class="visualizer" aria-hidden="true"><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i><i class="vizbar"></i></div>
    </div>
    <div class="bottom">
      <div id="progress" class="progress"><div id="fill" class="fill"></div></div><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div class="controls">
        <div class="leftctl"><button id="device" class="icon deviceBtn" title="devices"><svg viewBox="0 0 24 24"><path d="M1 18v3h3a3 3 0 0 0-3-3Zm0-5v2a6 6 0 0 1 6 6h2a8 8 0 0 0-8-8Zm0-4v2c5.52 0 10 4.48 10 10h2C13 14.37 7.63 9 1 9Zm14-6H9a2 2 0 0 0-2 2v3h2V5h6v6h-2v2h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/></svg><span id="deviceName">device</span></button></div>
        <div class="transport"><button id="prev" class="icon" title="previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button><button id="play" class="icon play" title="play/pause"></button><button id="next" class="icon" title="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button></div>
        <div class="rightctl"><button id="refresh" class="icon" title="refresh"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></button></div>
      </div>
    </div>
  </section>
</div>
<div id="panel" class="hidden"><div class="panelrow"><strong>output</strong><button id="closePanel" class="panelclose">×</button></div><label for="devices">spotify connect</label><select id="devices"></select><label for="volume">volume</label><input id="volume" type="range" min="0" max="100" step="1"><button id="signout" class="signout">disconnect spotify</button></div>
<div id="toast" class="toast"></div>
<script>
const CLIENT_ID='535468c73264439eb3e61bca260e4c3c';
const REDIRECT=location.origin+'/';
const SCOPES='user-read-playback-state user-read-currently-playing user-modify-playback-state';
const $=s=>document.querySelector(s); const qs=new URLSearchParams(location.search);
let playback=null,localProgress=0,localStamp=Date.now(),pollTimer=null;
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
function show(id){['login','idle','player'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}
function fmt(ms){ms=Math.max(0,ms||0);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function updateClock(){const d=new Date(),time=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),date=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});$('#clock').textContent=time;$('#idleClock').textContent=time;$('#idleDate').textContent=date;if(playback?.is_playing&&playback.item){localProgress=Math.min(playback.item.duration_ms,(playback.progress_ms||0)+(Date.now()-localStamp));paintProgress(localProgress,playback.item.duration_ms)}}
setInterval(updateClock,1000);updateClock();
function rand(len=48){const a=new Uint8Array(len);crypto.getRandomValues(a);return [...a].map(x=>('0'+x.toString(16)).slice(-2)).join('')}
async function challenge(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function signin(){const verifier=rand(),state=rand(16);sessionStorage.setItem('pkce_verifier',verifier);sessionStorage.setItem('oauth_state',state);const c=await challenge(verifier);const u=new URL('https://accounts.spotify.com/authorize');u.search=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:c,state,scope:SCOPES,show_dialog:'false'});location.href=u}
async function exchange(code){const verifier=sessionStorage.getItem('pkce_verifier');if(!verifier)throw Error('missing oauth verifier');const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT,code_verifier:verifier})});if(!r.ok)throw Error('spotify sign-in failed');storeTokens(await r.json());history.replaceState({},'',REDIRECT)}
function storeTokens(j){localStorage.setItem('spotify_access_token',j.access_token);localStorage.setItem('spotify_expires_at',String(Date.now()+j.expires_in*1000));if(j.refresh_token)localStorage.setItem('spotify_refresh_token',j.refresh_token)}
async function refreshToken(){const rt=localStorage.getItem('spotify_refresh_token');if(!rt)throw Error('sign in again');const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'refresh_token',refresh_token:rt})});if(!r.ok)throw Error('session expired');storeTokens(await r.json())}
async function token(){const exp=Number(localStorage.getItem('spotify_expires_at')||0);if(Date.now()>exp-45000)await refreshToken();return localStorage.getItem('spotify_access_token')}
async function api(path,opt={}){const t=await token();const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,...opt.headers}});if(r.status===401){await refreshToken();return api(path,opt)}if(r.status===429){toast('rate limited');return null}if(!r.ok)throw Error(String(r.status));if(r.status===204)return null;return r.json()}
function paintProgress(p,d){$('#fill').style.width=(d?Math.min(100,p/d*100):0)+'%';$('#elapsed').textContent=fmt(p);$('#duration').textContent=fmt(d)}
function renderPlayback(p){playback=p;localProgress=p?.progress_ms||0;localStamp=Date.now();if(!p||!p.item){document.body.classList.remove('playing');show('idle');return}show('player');document.body.classList.toggle('playing',!!p.is_playing);const item=p.item;const art=item.album?.images?.[0]?.url||'';$('#track').textContent=item.name||'Unknown';$('#artist').textContent=(item.artists||[]).map(a=>a.name).join(', ');$('#art').src=art;$('#bg').style.backgroundImage=art?`url("${art}")`:'';$('#play').innerHTML=p.is_playing?ICON_PAUSE:ICON_PLAY;$('#volume').value=p.device?.volume_percent??50;$('#deviceName').textContent=p.device?.name||'device';$('#context').textContent=p.context?.type==='playlist'?'From a playlist':p.context?.type==='album'?'From an album':'Spotify';paintProgress(localProgress,item.duration_ms)}
async function loadDevices(){const j=await api('/me/player/devices');const ds=j?.devices||[],s=$('#devices');s.innerHTML='';for(const d of ds){const o=document.createElement('option');o.value=d.id;o.textContent=d.name+(d.is_active?' • active':'');o.selected=d.is_active;s.appendChild(o)}if(!ds.length){const o=document.createElement('option');o.textContent='no devices';s.appendChild(o)}}
async function refresh(){try{const p=await api('/me/player');renderPlayback(p);await loadDevices()}catch(e){console.error(e);toast('spotify error')}}
async function cmd(path,method='POST',body){try{await api(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});setTimeout(refresh,220)}catch(e){console.error(e);toast('command failed')}}
$('#signin').onclick=signin;$('#play').onclick=()=>cmd(playback?.is_playing?'/me/player/pause':'/me/player/play','PUT');$('#prev').onclick=()=>cmd('/me/player/previous');$('#next').onclick=()=>cmd('/me/player/next');$('#refresh').onclick=refresh;
$('#device').onclick=()=>$('#panel').classList.remove('hidden');$('#closePanel').onclick=()=>$('#panel').classList.add('hidden');$('#devices').onchange=e=>{if(e.target.value)cmd('/me/player','PUT',{device_ids:[e.target.value],play:false})};
let vt;$('#volume').oninput=e=>{clearTimeout(vt);vt=setTimeout(()=>cmd('/me/player/volume?volume_percent='+encodeURIComponent(e.target.value),'PUT'),90)};
$('#signout').onclick=()=>{['spotify_access_token','spotify_refresh_token','spotify_expires_at'].forEach(k=>localStorage.removeItem(k));$('#panel').classList.add('hidden');show('login')};
$('#progress').onclick=e=>{if(!playback?.item)return;const r=e.currentTarget.getBoundingClientRect(),pos=Math.round((e.clientX-r.left)/r.width*playback.item.duration_ms);cmd('/me/player/seek?position_ms='+pos,'PUT')};$('#idle').onclick=refresh;
(async()=>{try{if(qs.get('error'))throw Error(qs.get('error'));if(qs.get('code')){if(qs.get('state')!==sessionStorage.getItem('oauth_state'))throw Error('oauth mismatch');await exchange(qs.get('code'))}if(!localStorage.getItem('spotify_refresh_token'))return show('login');await refresh();pollTimer=setInterval(refresh,3500)}catch(e){console.error(e);toast(e.message);show('login')}})();
</script>
</body>
</html>
